<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Ex6</title>
    <style>
      body {
        background: #efefef;
        color: #333;
        font-family: Arial, Helvetica, sans-serif;
      }

      .topbar {
        background: #f5f5f5;
        border-bottom: 1px solid #d9d9d9;
        min-height: 58px;
      }

      .navbar-inner {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 18px;
      }

      .nav-link {
        color: #4b4b4b !important;
        font-size: 14px;
      }

      .search-box {
        width: 170px;
        height: 36px;
        border: 1px solid #d2d2d2;
        background: #f7f7f7;
        border-radius: 4px;
        padding: 0 10px;
        color: #555;
      }

      .search-btn {
        height: 36px;
        border: 1px solid #d2d2d2;
        background: #f7f7f7;
        color: #555;
        border-radius: 4px;
        padding: 0 16px;
      }

      .page-wrap {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 18px 40px;
      }

      .hero {
        position: relative;
        margin-top: 18px;
        height: 310px;
        background: #d9d9d9;
        border: 1px solid #d3d3d3;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hero-text {
        font-size: 96px;
        font-weight: 300;
        letter-spacing: 1px;
        color: rgba(110, 110, 110, 0.7);
        line-height: 1;
      }

      .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 54px;
        line-height: 1;
        color: rgba(255, 255, 255, 0.8);
        background: transparent;
        border: none;
      }

      .arrow.left {
        left: 20px;
      }

      .arrow.right {
        right: 20px;
      }

      .slider-dot {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        width: 62px;
        height: 4px;
        background: #b4b4b4;
        border-radius: 3px;
      }

      .products {
        margin-top: 46px;
      }

      .section-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.4px;
        margin: 0;
        color: #3d3d3d;
      }

      .section-subtitle {
        margin-top: 8px;
        color: #7a7a7a;
        font-size: 16px;
        font-style: italic;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(220px, 1fr));
        gap: 18px;
        margin-top: 24px;
      }

      .product-card {
        position: relative;
        background: #f3f3f3;
        border: 1px solid #e0e0e0;
        overflow: hidden;
      }

      .sale-tag {
        position: absolute;
        top: 10px;
        right: 8px;
        background: linear-gradient(135deg, #f7a93a, #f79c1a);
        color: white;
        font-size: 15px;
        font-weight: 600;
        padding: 6px 10px;
        transform: rotate(18deg);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }

      .product-image {
        height: 250px;
        background: #d9d9d9;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(114, 114, 114, 0.7);
        font-size: 22px;
        font-weight: 300;
      }

      .product-body {
        background: #f0f0f0;
        padding: 12px 16px 16px;
      }

      .product-name {
        font-size: 15px;
        color: #2b2b2b;
        margin-bottom: 12px;
      }

      .price-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: #6e6e6e;
        margin-bottom: 12px;
      }

      .old-price {
        text-decoration: line-through;
      }

      .detail-btn {
        width: 100%;
        background: #f4f4f4;
        border: 1px solid #d8d8d8;
        color: #4f4f4f;
        font-size: 13px;
        padding: 8px 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .icon {
        font-size: 12px;
      }

      @media (max-width: 992px) {
        .product-grid {
          grid-template-columns: repeat(2, minmax(220px, 1fr));
        }
      }

      @media (max-width: 576px) {
        .product-grid {
          grid-template-columns: 1fr;
        }

        .hero-text {
          font-size: 52px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="topbar">
      <div
        class="navbar-inner d-flex align-items-center justify-content-between"
      >
        <div class="d-flex align-items-center gap-3">
          <a class="nav-link fw-bold text-dark" href="#">NavBar</a>
          <a class="nav-link" href="#">Home</a>
          <a class="nav-link" href="#">Link</a>
          <a class="nav-link" href="#">Dropdown</a>
        </div>

        <div class="d-flex align-items-center gap-2">
          <input class="search-box" type="text" placeholder="Search" />
          <button class="search-btn" type="button">Search</button>
        </div>
      </div>
    </nav>

    <div class="page-wrap">
      <section class="hero">
        <button class="arrow left" aria-label="Previous">‹</button>
        <div class="hero-text">1920 x 530</div>
        <button class="arrow right" aria-label="Next">›</button>
        <span class="slider-dot"></span>
      </section>

      <section class="products">
        <h2 class="section-title">NEW PRODUCT</h2>
        <p class="section-subtitle">List product description</p>

        <div class="product-grid">
          <div class="product-card">
            <div class="product-image">280 x 280</div>
            <div class="product-body">
              <div class="product-name">Product</div>
              <div class="price-row">
                <span class="old-price">100.000 vnd</span>
                <span>80.000 vnd</span>
              </div>
              <button class="detail-btn">
                <span>Xem chi tiết</span>
              </button>
            </div>
          </div>

          <div class="product-card">
            <div class="product-image">280 x 280</div>
            <div class="product-body">
              <div class="product-name">Product</div>
              <div class="price-row">
                <span class="old-price">100.000 vnd</span>
                <span>80.000 vnd</span>
              </div>
              <button class="detail-btn">
                <span>Xem chi tiết</span>
              </button>
            </div>
          </div>

          <div class="product-card">
            <div class="product-image">280 x 280</div>
            <div class="product-body">
              <div class="product-name">Product</div>
              <div class="price-row">
                <span class="old-price">100.000 vnd</span>
                <span>80.000 vnd</span>
              </div>
              <button class="detail-btn">
                <span>Xem chi tiết</span>
              </button>
            </div>
          </div>

          <div class="product-card">
            <div class="product-image">280 x 280</div>
            <div class="product-body">
              <div class="product-name">Product</div>
              <div class="price-row">
                <span class="old-price">100.000 vnd</span>
                <span>80.000 vnd</span>
              </div>
              <button class="detail-btn">
                <span>Xem chi tiết</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
