<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Ex7</title>
    <style>
      body {
        margin: 0;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
      }

      .container-wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 18px 14px 30px;
      }

      h2 {
        font-size: 34px;
        font-weight: 700;
        margin: 0 0 20px;
        color: #1f1f1f;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(220px, 1fr));
        gap: 0;
      }

      .card-item {
        background: #fff;
        min-height: 400px;
        border: 4px solid;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      .card-item.blue {
        border-color: #1a8ef0;
        background: #1a8ef0;
      }

      .card-item.yellow {
        border-color: #f0b53b;
        background: #f0b53b;
      }

      .card-item.red {
        border-color: #d64b4b;
        background: #d64b4b;
      }

      .card-image {
        width: 100%;
        height: 240px;
        object-fit: contain;
        background: transparent;
        padding: 14px 18px 0;
      }

      .card-text {
        margin-top: auto;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        text-align: center;
        font-size: 16px;
        padding: 18px 10px 20px;
      }

      @media (max-width: 768px) {
        .card-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container-wrap">
      <h2>Cards Columns</h2>

      <div class="card-grid">
        <div class="card-item blue">
          <img class="card-image" src="../../public/images/fpt.png" alt="Car" />
          <div class="card-text">Some text inside the first card</div>
        </div>

        <div class="card-item yellow">
          <img class="card-image" src="../../public/images/fpt.png" alt="Car" />
          <div class="card-text">Some text inside the first card</div>
        </div>

        <div class="card-item red">
          <img class="card-image" src="../../public/images/fpt.png" alt="Car" />
          <div class="card-text">Some text inside the first card</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
