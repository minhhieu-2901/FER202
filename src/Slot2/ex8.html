<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Ex8</title>
    <style>
      body {
        margin: 0;
        background: #efefef;
        font-family: Arial, Helvetica, sans-serif;
        color: #222;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 24px;
      }

      .form-card {
        width: 100%;
        max-width: 620px;
        background: #f4f4f4;
        border: 1px solid #d8d8d8;
        border-radius: 0;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.02);
        position: relative;
      }

      .close-btn {
        position: absolute;
        top: 12px;
        right: 16px;
        font-size: 25px;
        color: #666;
        border: none;
        background: transparent;
        line-height: 1;
        cursor: pointer;
      }

      .form-body {
        padding: 30px 18px 18px;
      }

      h2 {
        margin: 0 0 18px;
        font-weight: 700;
        font-size: 28px;
      }

      .field {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 15px;
        margin-bottom: 8px;
        color: #333;
      }

      .input-group {
        position: relative;
      }

      .input-group .icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #888;
        font-size: 17px;
      }

      .form-control {
        width: 100%;
        height: 42px;
        border: 1px solid #d4d4d4;
        border-radius: 4px;
        background: #fff;
        padding: 0 12px;
        font-size: 15px;
        color: #333;
      }

      .input-with-icon {
        padding-left: 38px;
      }

      .currency {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
        font-size: 13px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .half {
        width: 100%;
      }

      select,
      input[type="text"] {
        appearance: none;
      }

      .select-wrap {
        position: relative;
      }

      .select-wrap::after {
        content: "▼";
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 12px;
        color: #666;
        pointer-events: none;
      }

      .radio-row {
        margin-top: 8px;
        display: flex;
        gap: 26px;
        align-items: center;
        font-size: 14px;
        color: #333;
      }

      .radio-row label {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }

      .radio-row input[type="radio"] {
        accent-color: #007bff;
      }

      .submit-btn {
        margin-top: 12px;
        width: 100%;
        height: 46px;
        border: none;
        background: #1a8ef0;
        color: #fff;
        font-weight: 600;
        font-size: 20px;
        cursor: pointer;
      }

      @media (max-width: 576px) {
        .form-card {
          max-width: 94%;
        }

        .form-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="form-card">
        <button class="close-btn" type="button" aria-label="Close">×</button>

        <div class="form-body">
          <h2>Form đặt vé máy bay</h2>

          <div class="field">
            <label>Họ tên</label>
            <div class="input-group">
              <span class="icon">◔</span>
              <input
                class="form-control input-with-icon"
                type="text"
                placeholder="Họ tên"
              />
            </div>
          </div>

          <div class="field">
            <label>Phải nhập 5 ký tự trở lên</label>
            <div class="input-group">
              <span class="icon">⌂</span>
              <input
                class="form-control input-with-icon"
                type="text"
                placeholder="Phải nhập 5 ký tự trở lên, in hoa..."
              />
            </div>
          </div>

          <div class="field">
            <label>Địa chỉ</label>
            <div class="input-group">
              <span class="icon">⌂</span>
              <input
                class="form-control input-with-icon"
                type="text"
                placeholder="Phải nhập 5 ký tự trở lên, in hoa..."
              />
            </div>
          </div>

          <div class="form-row">
            <div class="field half">
              <label>Đi từ</label>
              <div class="select-wrap">
                <select class="form-control" aria-label="Đi từ">
                  <option>Hà Nội</option>
                  <option>Đà Nẵng</option>
                  <option>TP.HCM</option>
                </select>
              </div>
            </div>

            <div class="field half">
              <label>Đến</label>
              <div class="select-wrap">
                <select class="form-control" aria-label="Đến">
                  <option>Hà Nội</option>
                  <option>Đà Nẵng</option>
                  <option>TP.HCM</option>
                </select>
              </div>
            </div>
          </div>

          <div class="field">
            <label>Chọn chiều đi (Khứ hồi)</label>
            <div class="radio-row">
              <label><input type="radio" name="flight-type" /> Đi</label>
              <label
                ><input type="radio" name="flight-type" checked /> Về</label
              >
            </div>
          </div>

          <button class="submit-btn" type="button">Đặt vé</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
